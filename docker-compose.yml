version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/menteko
      - CORS_ORIGIN=*
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: docker.io/library/mongo:latest
    environment:
      # Required for Linux kernel >= 6.19 compatibility (SERVER-121912)
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
